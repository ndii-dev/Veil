version: 2
# Minor and patch bumps arrive as one PR per package per week; majors
# stay separate because they can break things.
updates:
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/proof-server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Must match the nargo/bb versions pinned in proof-server.yml and the
    # Dockerfile; bump all of them together by hand.
    ignore:
      - dependency-name: "@noir-lang/noir_js"
      - dependency-name: "@aztec/bb.js"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "cargo"
    directory: "/contracts"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # Bumps the actions used in .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # Bumps the digest-pinned Node base image in the proof-server Dockerfile.
  - package-ecosystem: "docker"
    directory: "/proof-server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # Bumps the digest-pinned Node base image in the backend Dockerfile.
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
